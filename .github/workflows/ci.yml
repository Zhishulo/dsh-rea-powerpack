name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show toolchain
        run: node --version && npm --version

      - name: Run tests
        run: npm test

      - name: Lint (syntax check every core file)
        run: npm run lint

      - name: Check the client bundle
        run: npm run check:client
